<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Product · SubscriptIQ</title></head><body><main>
<div th:replace="~{fragments/ui :: pageHeader('Product details', null, null)}"></div>
<form th:action="@{/admin/products}" th:object="${form}" method="post">
<div class="card mb-3"><div class="card-body"><div class="row g-3">
    <div class="col-md-8"><label class="form-label">Name</label><input class="form-control" th:field="*{name}" placeholder="e.g. Professional"></div>
    <div class="col-md-4"><label class="form-label">Product type</label><select class="form-select" th:field="*{type}"><option th:each="type : ${types}" th:value="${type}" th:text="${type}"></option></select></div>
    <div class="col-md-4"><label class="form-label">Sales price</label><input class="form-control" type="number" step="0.01" th:field="*{salesPrice}"></div>
    <div class="col-md-4"><label class="form-label">Cost price</label><input class="form-control" type="number" step="0.01" th:field="*{costPrice}"></div>
    <div class="col-md-4"><label class="form-label">Tax</label><select class="form-select" name="taxId"><option th:each="tax : ${taxes}" th:value="${tax.id}" th:text="|${tax.name} (${tax.ratePercent}%)|"></option></select></div>
    <div class="col-12"><label class="form-label">Notes</label><textarea class="form-control" rows="3" th:field="*{notes}"></textarea></div>
    <div class="col-12 form-check form-switch ms-2"><input class="form-check-input" type="checkbox" th:field="*{active}"><label class="form-check-label">Active</label></div>
</div></div></div>
<div class="card mb-3"><div class="card-header d-flex justify-content-between"><h2 class="h6 mb-0">Variants</h2><button class="btn btn-sm btn-outline-primary" type="button" data-add-row="#variantRows">Add variant</button></div>
    <div class="table-responsive"><table class="table"><thead><tr><th>Attribute</th><th>Value</th><th>Additional price</th><th></th></tr></thead><tbody id="variantRows"><tr th:each="variant : ${variants}"><td th:text="${variant.attribute}">Users</td><td th:text="${variant.value}">5 seats</td><td th:text="${@fmt.money(variant.extraPrice)}"></td><td><button class="btn btn-sm btn-outline-danger" type="button" data-remove-row>Remove</button></td></tr><tr th:if="${#lists.isEmpty(variants)}"><td colspan="4" class="text-secondary">No variants added.</td></tr></tbody></table></div>
</div>
<div class="d-flex gap-2"><button class="btn btn-primary">Save product</button><a class="btn btn-light" href="/admin/products">Cancel</a></div></form>
</main></body></html>
