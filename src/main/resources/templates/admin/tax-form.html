<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Tax · SubscriptIQ</title></head><body><main>
<div th:replace="~{fragments/ui :: pageHeader('Tax details', null, null)}"></div>
<form th:action="@{/admin/taxes}" th:object="${form}" method="post"><div class="card mb-3"><div class="card-body row g-3">
    <div class="col-md-8"><label class="form-label">Tax name</label><input class="form-control" th:field="*{name}"></div>
    <div class="col-md-4"><label class="form-label">Rate (%)</label><input class="form-control" type="number" step="0.01" min="0" th:field="*{ratePercent}"></div>
    <div class="col-12 form-check form-switch ms-2"><input class="form-check-input" type="checkbox" th:field="*{active}"><label class="form-check-label">Active</label></div>
</div></div><button class="btn btn-primary">Save tax</button> <a class="btn btn-light" href="/admin/taxes">Cancel</a></form>
</main></body></html>
