<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Plans · SubscriptIQ</title></head><body><main>
<div th:replace="~{fragments/ui :: pageHeader('Plans', 'New plan', '/admin/plans/new')}"></div>
<div class="card"><div class="card-header"><form class="row g-2 search-toolbar" method="get" action="/admin/plans"><div class="col-sm-8 search-query"><input class="form-control" type="search" name="q" th:value="${q}" placeholder="Search plans or products" aria-label="Search plans"></div><div class="col-sm-2 search-action"><button class="btn btn-primary" type="submit">Search</button></div><div class="col-sm-2 search-action"><a class="btn btn-outline-secondary" href="/admin/plans">Clear</a></div></form></div><div class="table-responsive" th:if="${page != null and !page.empty}"><table class="table"><thead><tr><th>Plan</th><th>Product</th><th>Period</th><th>Price</th><th>Renewal</th><th>Status</th></tr></thead><tbody>
    <tr th:each="plan : ${page.content}"><td class="fw-semibold" th:text="${plan.name}">Professional monthly</td><td th:text="${plan.product.name}">Professional</td><td th:text="${plan.billingPeriod.toString()}">MONTHLY</td><td th:text="${@fmt.money(plan.price)}">₹10,000.00</td><td th:text="${plan.allowRenew ? 'Renewable' : 'No renewal'}"></td><td><span th:replace="~{fragments/ui :: statusBadge(${plan.active ? 'ACTIVE' : 'CLOSED'})}"></span></td></tr>
</tbody></table></div><th:block th:if="${page == null or page.empty}"><div th:replace="~{fragments/ui :: emptyState(${q == null or q.isBlank() ? 'Create a plan to define recurring pricing.' : 'No plans found. Try a different search.'})}"></div></th:block><div class="card-body border-top"><div th:replace="~{fragments/ui :: pagination(${page}, '/admin/plans', ${q}, null, null)}"></div></div></div>
</main></body></html>
