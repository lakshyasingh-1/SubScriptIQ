<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Discount · SubscriptIQ</title></head><body><main>
<div th:replace="~{fragments/ui :: pageHeader('Discount details', null, null)}"></div>
<form th:action="@{/admin/discounts}" th:object="${form}" method="post"><div class="card mb-3"><div class="card-body row g-3">
    <div class="col-md-6"><label class="form-label">Name</label><input class="form-control" th:field="*{name}"></div>
    <div class="col-md-3"><label class="form-label">Discount type</label><select class="form-select" th:field="*{type}"><option th:each="type : ${types}" th:value="${type}" th:text="${type}"></option></select></div>
    <div class="col-md-3"><label class="form-label">Value</label><input class="form-control" type="number" step="0.01" th:field="*{value}"></div>
    <div class="col-md-4"><label class="form-label">Applies to</label><select class="form-select" th:field="*{scope}" data-discount-scope><option th:each="scope : ${scopes}" th:value="${scope}" th:text="${scope}"></option></select></div>
    <div class="col-md-4"><label class="form-label">Minimum purchase</label><input class="form-control" type="number" step="0.01" th:field="*{minPurchase}"></div>
    <div class="col-md-4"><label class="form-label">Minimum quantity</label><input class="form-control" type="number" min="1" th:field="*{minQuantity}"></div>
    <div class="col-md-4"><label class="form-label">Start date</label><input class="form-control" type="date" name="startDate"></div>
    <div class="col-md-4"><label class="form-label">End date</label><input class="form-control" type="date" name="endDate"></div>
    <div class="col-md-4"><label class="form-label">Usage limit</label><input class="form-control" type="number" min="1" th:field="*{usageLimit}"></div>
    <div class="col-12" data-product-scope hidden><label class="form-label">Products</label><select class="form-select" name="productIds" multiple><option th:each="product : ${products}" th:value="${product.id}" th:text="${product.name}"></option></select></div>
    <div class="col-12 form-check form-switch ms-2"><input class="form-check-input" type="checkbox" th:field="*{active}"><label class="form-check-label">Active</label></div>
</div></div><button class="btn btn-primary">Save discount</button> <a class="btn btn-light" href="/admin/discounts">Cancel</a></form>
</main></body></html>
