<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Subscriptions · SubscriptIQ</title></head><body><main>
<div th:replace="~{fragments/ui :: pageHeader('Subscriptions', 'New subscription', '/subscriptions/new')}"></div>
<div class="d-flex flex-wrap gap-2 mb-3"><a class="btn btn-sm" th:each="chip : ${ {'ALL','DRAFT','QUOTATION','CONFIRMED','ACTIVE','PAUSED','CLOSED'} }" th:classappend="${status == chip or (status == null and chip == 'ALL')} ? 'btn-primary' : 'btn-outline-secondary'" th:href="@{/subscriptions(status=${chip == 'ALL' ? null : chip}, q=${q})}" th:text="${chip}">ALL</a></div>
<div class="card"><div class="card-header"><form class="row g-2 search-toolbar" method="get" action="/subscriptions"><input type="hidden" name="status" th:value="${status}"><div class="col-sm-8 search-query"><input class="form-control" type="search" name="q" th:value="${q}" placeholder="Search number, customer or plan" aria-label="Search subscriptions"></div><div class="col-sm-2 search-action"><button class="btn btn-primary" type="submit">Search</button></div><div class="col-sm-2 search-action"><a class="btn btn-outline-secondary" href="/subscriptions">Clear</a></div></form></div>
<div class="table-responsive" th:if="${page != null and !page.empty}"><table class="table"><thead><tr><th>Subscription</th><th>Customer</th><th>Plan</th><th>Status</th><th>Next billing</th></tr></thead><tbody><tr th:each="subscription : ${page.content}"><td><a th:href="@{|/subscriptions/${subscription.id}|}" th:text="${subscription.number}"></a></td><td th:text="${subscription.customer.name}"></td><td th:text="${subscription.plan.name}"></td><td><span th:replace="~{fragments/ui :: statusBadge(${subscription.status})}"></span></td><td th:text="${@fmt.date(subscription.nextBillingDate)}"></td></tr></tbody></table></div>
<th:block th:if="${page == null or page.empty}"><div th:replace="~{fragments/ui :: emptyState(${q == null or q.isBlank() ? 'No subscriptions match these filters.' : 'No subscriptions found. Try a different search.'})}"></div></th:block><div class="card-body border-top"><div th:replace="~{fragments/ui :: pagination(${page}, '/subscriptions', ${q}, ${status}, null)}"></div></div></div>
</main></body></html>
