<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Collections · SubscriptIQ</title></head><body><main>
<div th:replace="~{fragments/ui :: pageHeader('Collections', null, null)}"></div>
<div class="row g-3 mb-4"><div class="col-6 col-lg-3" th:each="bucket : ${aging}"><div class="card metric-card"><div class="metric-label" th:text="${bucket.label}">1–30 days</div><div class="metric-value" th:text="${bucket.count}">8</div><div class="metric-note" th:text="${@fmt.money(bucket.amount)}"></div></div></div></div>
<div class="card"><div class="card-header"><div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h6 mb-0">Overdue invoices</h2><span class="badge text-bg-light text-dark" th:text="|${page.totalElements} overdue|">14 overdue</span></div><form class="row g-2 search-toolbar" method="get" action="/collections"><div class="col-sm-8 search-query"><input class="form-control" type="search" name="q" th:value="${q}" placeholder="Search invoice or customer" aria-label="Search overdue invoices"></div><div class="col-sm-2 search-action"><button class="btn btn-primary" type="submit">Search</button></div><div class="col-sm-2 search-action"><a class="btn btn-outline-secondary" href="/collections">Clear</a></div></form></div>
    <div class="table-responsive" th:if="${page != null and !page.empty}"><table class="table"><thead><tr><th>Invoice</th><th>Customer</th><th>Due date</th><th>Status</th><th>Outstanding</th><th></th></tr></thead><tbody><tr th:each="invoice : ${page.content}" class="table-danger"><td><a th:href="@{|/invoices/${invoice.id}|}" th:text="${invoice.number}"></a></td><td th:text="${invoice.customer.name}"></td><td th:text="${@fmt.date(invoice.dueDate)}"></td><td><span th:replace="~{fragments/ui :: statusBadge('OVERDUE')}"></span></td><td class="fw-semibold" th:text="${@fmt.money(invoice.outstanding)}"></td><td><a th:href="@{|/payments/new?invoiceId=${invoice.id}|}">Record payment</a></td></tr></tbody></table></div>
    <th:block th:if="${page == null or page.empty}"><div th:replace="~{fragments/ui :: emptyState(${q == null or q.isBlank() ? 'No overdue balances. Great work!' : 'No matching overdue invoices found.'})}"></div></th:block>
    <div class="card-body border-top"><div th:replace="~{fragments/ui :: pagination(${page}, '/collections', ${q}, null, null)}"></div></div>
</div>
</main></body></html>
