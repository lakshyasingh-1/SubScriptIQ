<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Invoice details · SubscriptIQ</title></head><body><main>
<div class="page-heading d-flex flex-wrap justify-content-between align-items-center gap-3"><div class="d-flex align-items-center gap-3"><img class="brand-logo invoice-brand-logo" th:src="@{/images/subscriptiq-logo.png}" alt="SubscriptIQ"><div><p class="eyebrow mb-1">INVOICE</p><h1 class="h3 mb-0" th:text="${invoice.number}">INV-2026-031</h1><p class="text-secondary mb-0" th:text="${invoice.customer.name}">Customer</p></div></div><div class="d-flex align-items-center gap-2"><span th:replace="~{fragments/ui :: statusBadge(${invoice.status})}"></span><a class="btn btn-outline-primary btn-sm" th:if="${#lists.contains(actions, 'print')}" th:href="@{|/invoices/${invoice.id}/print|}">Print</a><a class="btn btn-outline-primary btn-sm" th:if="${#lists.contains(actions, 'pdf')}" th:href="@{|/invoices/${invoice.id}/pdf|}">Download PDF</a></div></div>
<div class="row g-3 mb-4"><div class="col-6 col-lg-3"><div class="card metric-card"><div class="metric-label">Invoice total</div><div class="metric-value" th:text="${@fmt.money(invoice.total)}"></div></div></div>
    <div class="col-6 col-lg-3"><div class="card metric-card"><div class="metric-label">Amount paid</div><div class="metric-value" th:text="${@fmt.money(invoice.amountPaid)}"></div></div></div>
    <div class="col-6 col-lg-3"><div class="card metric-card"><div class="metric-label">Outstanding</div><div class="metric-value text-primary" th:text="${@fmt.money(invoice.outstanding)}"></div></div></div>
    <div class="col-6 col-lg-3"><div class="card metric-card"><div class="metric-label">Due date</div><div class="metric-value fs-5" th:text="${@fmt.date(invoice.dueDate)}"></div></div></div></div>
<div class="card mb-4"><div class="card-header"><h2 class="h6 mb-0">Invoice breakdown</h2></div><div class="table-responsive"><table class="table"><thead><tr><th>Description</th><th>Qty</th><th>Unit price</th><th>Amount</th><th>Discount</th><th>Tax</th></tr></thead><tbody>
    <tr th:each="line : ${invoice.lines}"><td class="fw-semibold" th:text="${line.description}"></td><td th:text="${line.quantity}"></td><td th:text="${@fmt.money(line.unitPrice)}"></td><td th:text="${@fmt.money(line.lineAmount)}"></td><td><span th:text="${@fmt.money(line.discountAmount)}"></span><small class="d-block text-secondary" th:text="${line.discountLabel}"></small></td><td><span th:text="|${line.taxRatePercent}%|"></span><small class="d-block text-secondary" th:text="${@fmt.money(line.taxAmount)}"></small></td></tr>
</tbody></table></div><div class="card-body border-top"><div class="row justify-content-end"><div class="col-md-5 col-lg-4">
    <div class="d-flex justify-content-between py-1"><span class="text-secondary">Subtotal</span><span th:text="${@fmt.money(invoice.subtotal)}"></span></div>
    <div class="d-flex justify-content-between py-1"><span class="text-secondary">Discount</span><span th:text="${@fmt.money(invoice.discountTotal)}"></span></div>
    <div class="d-flex justify-content-between py-1"><span class="text-secondary">Tax</span><span th:text="${@fmt.money(invoice.taxTotal)}"></span></div>
    <div class="d-flex justify-content-between border-top mt-2 pt-2 fw-bold"><span>Total</span><span th:text="${@fmt.money(invoice.total)}"></span></div>
    <div class="d-flex justify-content-between py-1"><span class="text-secondary">Amount paid</span><span th:text="${@fmt.money(invoice.amountPaid)}"></span></div>
    <div class="d-flex justify-content-between fw-bold text-primary"><span>Outstanding</span><span th:text="${@fmt.money(invoice.outstanding)}"></span></div>
</div></div></div></div>
<div class="card mb-4"><div class="card-header d-flex justify-content-between"><h2 class="h6 mb-0">Payment history</h2><a class="btn btn-sm btn-outline-primary" th:if="${#lists.contains(actions, 'add-payment')}" th:href="@{|/payments/new?invoiceId=${invoice.id}|}">Add payment</a></div><div class="table-responsive"><table class="table"><thead><tr><th>Date</th><th>Method</th><th>Note</th><th>Amount</th></tr></thead><tbody><tr th:each="payment : ${payments}"><td th:text="${@fmt.date(payment.paidOn)}"></td><td th:text="${payment.method.toString()}"></td><td th:text="${payment.note}"></td><td th:text="${@fmt.money(payment.amount)}"></td></tr></tbody></table></div></div>
<div class="d-flex flex-wrap gap-2"><form th:each="action : ${actions}" th:if="${action == 'confirm' or action == 'cancel' or action == 'send'}" th:action="@{|/invoices/${invoice.id}/${action}|}" method="post"><button class="btn btn-outline-primary" th:attr="data-confirm=${action == 'cancel' ? 'Cancel this invoice?' : null}" th:text="${#strings.capitalize(action)}">Confirm</button></form></div>
</main></body></html>
