<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Invoice print · SubscriptIQ</title></head><body><main>
<div class="d-flex justify-content-end gap-2 mb-3 no-print"><button class="btn btn-primary" type="button" onclick="window.print()">Print invoice</button><a class="btn btn-outline-primary" th:href="@{|/invoices/${invoice.id}/pdf|}">Download PDF</a></div>
<article class="print-sheet card">
    <div class="d-flex flex-wrap justify-content-between gap-4 mb-5"><div class="d-flex align-items-start gap-3"><img class="brand-logo invoice-print-logo" th:src="@{/images/subscriptiq-logo.png}" alt="SubscriptIQ"><div><p class="eyebrow">INVOICE FROM</p><h1 class="h4" th:text="${company.name}">Brightloop Software</h1><p class="text-secondary mb-1" th:text="${company.address}"></p><p class="text-secondary mb-1" th:text="${company.email}"></p><p class="text-secondary mb-0" th:text="${company.phone}"></p></div></div>
        <div class="text-md-end"><p class="eyebrow">INVOICE</p><h2 class="h3" th:text="${invoice.number}">INV-2026-031</h2><span th:replace="~{fragments/ui :: statusBadge(${invoice.status})}"></span></div></div>
    <div class="row mb-4"><div class="col-md-6"><p class="eyebrow">BILL TO</p><strong th:text="${invoice.customer.name}">Customer</strong><p class="text-secondary mb-0" th:text="${invoice.customer.address}"></p></div>
        <div class="col-md-6 text-md-end"><p class="mb-1"><span class="text-secondary">Invoice date</span> <strong th:text="${@fmt.date(invoice.invoiceDate)}"></strong></p><p class="mb-1"><span class="text-secondary">Due date</span> <strong th:text="${@fmt.date(invoice.dueDate)}"></strong></p><p class="mb-0"><span class="text-secondary">Billing period</span> <strong th:text="|${@fmt.date(invoice.periodStart)} – ${@fmt.date(invoice.periodEnd)}|"></strong></p></div></div>
    <div class="table-responsive"><table class="table"><thead><tr><th>Description</th><th>Qty</th><th>Unit price</th><th>Discount</th><th>Tax</th><th class="text-end">Amount</th></tr></thead><tbody>
        <tr th:each="line : ${invoice.lines}"><td th:text="${line.description}"></td><td th:text="${line.quantity}"></td><td th:text="${@fmt.money(line.unitPrice)}"></td><td><span th:text="${@fmt.money(line.discountAmount)}"></span><small class="d-block text-secondary" th:text="${line.discountLabel}"></small></td><td><span th:text="|${line.taxRatePercent}% · ${@fmt.money(line.taxAmount)}|"></span></td><td class="text-end" th:text="${@fmt.money(line.lineAmount)}"></td></tr>
    </tbody></table></div>
    <div class="row justify-content-end mt-4"><div class="col-md-5 col-lg-4"><div class="d-flex justify-content-between py-1"><span>Subtotal</span><span th:text="${@fmt.money(invoice.subtotal)}"></span></div><div class="d-flex justify-content-between py-1"><span>Discount</span><span th:text="${@fmt.money(invoice.discountTotal)}"></span></div><div class="d-flex justify-content-between py-1"><span>Tax</span><span th:text="${@fmt.money(invoice.taxTotal)}"></span></div><div class="d-flex justify-content-between border-top mt-2 pt-2 fw-bold"><span>Total</span><span th:text="${@fmt.money(invoice.total)}"></span></div><div class="d-flex justify-content-between py-1"><span>Paid</span><span th:text="${@fmt.money(invoice.amountPaid)}"></span></div><div class="d-flex justify-content-between fw-bold"><span>Outstanding</span><span th:text="${@fmt.money(invoice.outstanding)}"></span></div></div></div>
    <p class="small text-secondary border-top mt-5 pt-3 mb-0">Thank you for choosing Brightloop Software.</p>
</article>
</main></body></html>
