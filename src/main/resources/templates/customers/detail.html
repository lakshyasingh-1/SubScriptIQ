<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Customer details · SubscriptIQ</title></head><body><main>
<div class="page-heading d-flex justify-content-between align-items-center gap-3"><div><p class="eyebrow mb-1">CUSTOMER PROFILE</p><h1 class="h3 mb-0" th:text="${customer.name}">Northstar Labs</h1></div><a class="btn btn-outline-primary" th:href="@{|/customers/${customer.id}/edit|}">Edit profile</a></div>
<div class="row g-3 mb-4"><div class="col-lg-5"><div class="card h-100"><div class="card-body"><h2 class="h6 mb-3">Contact information</h2><p class="mb-2"><strong th:text="${customer.company}">Northstar Labs</strong></p><p class="mb-1" th:text="${customer.email}"></p><p class="mb-1" th:text="${customer.phone}"></p><p class="small text-secondary mb-0" th:text="${customer.address}"></p></div></div></div>
<div class="col-lg-7"><div class="card h-100"><div class="card-body"><h2 class="h6 mb-3">Quick actions</h2><a class="btn btn-primary btn-sm" href="/subscriptions/new">Create subscription</a> <a class="btn btn-outline-primary btn-sm" href="/payments/new">Record payment</a></div></div></div></div>
<div class="card mb-4"><div class="card-header"><h2 class="h6 mb-0">Subscriptions</h2></div><div class="table-responsive"><table class="table"><thead><tr><th>Number</th><th>Plan</th><th>Status</th><th>Next billing</th></tr></thead><tbody><tr th:each="subscription : ${subscriptions}"><td><a th:href="@{|/subscriptions/${subscription.id}|}" th:text="${subscription.number}"></a></td><td th:text="${subscription.plan.name}"></td><td><span th:replace="~{fragments/ui :: statusBadge(${subscription.status})}"></span></td><td th:text="${@fmt.date(subscription.nextBillingDate)}"></td></tr></tbody></table></div></div>
<div class="card"><div class="card-header"><h2 class="h6 mb-0">Recent invoices</h2></div><div class="table-responsive"><table class="table"><thead><tr><th>Invoice</th><th>Date</th><th>Status</th><th>Outstanding</th></tr></thead><tbody><tr th:each="invoice : ${invoices}"><td><a th:href="@{|/invoices/${invoice.id}|}" th:text="${invoice.number}"></a></td><td th:text="${@fmt.date(invoice.invoiceDate)}"></td><td><span th:replace="~{fragments/ui :: statusBadge(${invoice.status})}"></span></td><td th:text="${@fmt.money(invoice.outstanding)}"></td></tr></tbody></table></div></div>
</main></body></html>
