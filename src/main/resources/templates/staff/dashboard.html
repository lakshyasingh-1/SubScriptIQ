<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Staff workspace · SubscriptIQ</title></head><body><main>
<div th:replace="~{fragments/ui :: pageHeader('Today’s work', null, null)}"></div>
<div class="row g-3 mb-4"><div class="col-6 col-lg-3"><div class="card metric-card"><div class="metric-label">Draft invoices</div><div class="metric-value" th:text="${draftInvoiceCount}">8</div><div class="metric-note">Ready to review</div></div></div><div class="col-6 col-lg-3"><div class="card metric-card"><div class="metric-label">Overdue invoices</div><div class="metric-value text-danger" th:text="${overdueCount}">14</div><div class="metric-note">Follow-up needed</div></div></div><div class="col-6 col-lg-3"><div class="card metric-card"><div class="metric-label">Renewals due</div><div class="metric-value" th:text="${#lists.size(renewalsDue)}">3</div><div class="metric-note">Coming up soon</div></div></div><div class="col-6 col-lg-3"><div class="card metric-card"><div class="metric-label">Business date</div><div class="metric-value fs-5" th:text="${@fmt.date(today)}"></div><div class="metric-note">Current demo date</div></div></div></div>
<div class="card mb-4"><div class="card-header d-flex justify-content-between"><h2 class="h6 mb-0">Overdue invoices</h2><a href="/collections">View collections</a></div><div class="table-responsive"><table class="table"><thead><tr><th>Invoice</th><th>Customer</th><th>Due</th><th>Outstanding</th><th></th></tr></thead><tbody><tr th:each="invoice : ${overdueInvoices}" class="table-danger"><td><a th:href="@{|/invoices/${invoice.id}|}" th:text="${invoice.number}"></a></td><td th:text="${invoice.customer.name}"></td><td th:text="${@fmt.date(invoice.dueDate)}"></td><td th:text="${@fmt.money(invoice.outstanding)}"></td><td><a th:href="@{|/payments/new?invoiceId=${invoice.id}|}">Record payment</a></td></tr></tbody></table></div></div>
<div class="card"><div class="card-header"><h2 class="h6 mb-0">Renewals due</h2></div><div class="table-responsive"><table class="table"><thead><tr><th>Subscription</th><th>Customer</th><th>Plan</th><th>Next billing</th></tr></thead><tbody><tr th:each="subscription : ${renewalsDue}"><td><a th:href="@{|/subscriptions/${subscription.id}|}" th:text="${subscription.number}"></a></td><td th:text="${subscription.customer.name}"></td><td th:text="${subscription.plan.name}"></td><td th:text="${@fmt.date(subscription.nextBillingDate)}"></td></tr></tbody></table></div></div>
</main></body></html>
