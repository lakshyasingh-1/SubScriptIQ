<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Subscription · SubscriptIQ</title></head><body><main><div class="portal-shell">
<div class="page-heading"><a class="small" href="/portal/subscriptions">← My subscriptions</a><div class="d-flex justify-content-between align-items-start mt-3"><div><p class="eyebrow mb-1" th:text="${subscription.number}"></p><h1 class="h3" th:text="${subscription.plan.name}"></h1></div><span th:replace="~{fragments/ui :: statusBadge(${subscription.status})}"></span></div></div>
<div class="card mb-4"><div class="card-body"><div class="row g-3"><div class="col-6"><small class="text-secondary d-block">Started</small><strong th:text="${@fmt.date(subscription.startDate)}"></strong></div><div class="col-6"><small class="text-secondary d-block">Next billing</small><strong th:text="${@fmt.date(subscription.nextBillingDate)}"></strong></div><div class="col-6"><small class="text-secondary d-block">Renewal date</small><strong th:text="${@fmt.date(subscription.expiryDate)}"></strong></div><div class="col-6"><small class="text-secondary d-block">Billing period</small><strong th:text="${subscription.plan.billingPeriod.toString()}"></strong></div></div></div></div>
<div class="card mb-4"><div class="card-header"><h2 class="h6 mb-0">Plan details</h2></div><div class="card-body"><div class="d-flex justify-content-between"><span th:text="${subscription.plan.name}"></span><strong th:text="|${@fmt.money(subscription.plan.price)} / ${subscription.plan.billingPeriod}|"></strong></div><p class="small text-secondary mt-2 mb-0">Questions about your plan? Contact <a href="mailto:billing@brightloop.example">billing@brightloop.example</a>.</p></div></div>
<div class="d-flex flex-wrap gap-2 mb-4"><form th:each="action : ${actions}" th:if="${action == 'send-quotation' or action == 'confirm' or action == 'activate' or action == 'pause' or action == 'resume' or action == 'close' or action == 'renew' or action == 'cancel'}" th:action="@{|/portal/subscriptions/${subscription.id}/transition/${action}|}" method="post"><button class="btn btn-outline-primary btn-sm" th:attr="data-confirm=${action == 'close' or action == 'cancel' ? 'Are you sure?' : null}" th:text="${#strings.capitalize(#strings.replace(action, '-', ' '))}">Action</button></form></div>
<div class="card"><div class="card-header"><h2 class="h6 mb-0">Related invoices</h2></div><div class="list-group list-group-flush"><a class="list-group-item list-group-item-action d-flex justify-content-between" th:each="invoice : ${invoices}" th:href="@{|/portal/invoices/${invoice.id}|}"><span th:text="${invoice.number}"></span><span th:replace="~{fragments/ui :: statusBadge(${invoice.status})}"></span></a></div></div>
</div></main></body></html>
