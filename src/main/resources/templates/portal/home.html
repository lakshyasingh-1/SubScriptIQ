<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Customer portal · SubscriptIQ</title></head><body><main><div class="portal-shell">
<div class="page-heading"><p class="eyebrow mb-1">CUSTOMER PORTAL</p><h1 class="h3 mb-1" th:text="|Welcome, ${customer.name}|">Welcome</h1><p class="text-secondary mb-0">Your subscriptions and billing at a glance.</p></div>
<div class="row g-3 mb-4"><div class="col-6"><div class="card metric-card"><div class="metric-label">Subscriptions</div><div class="metric-value" th:text="${#lists.size(subscriptions)}">2</div><a class="small" href="/portal/subscriptions">View all</a></div></div><div class="col-6"><div class="card metric-card"><div class="metric-label">Open invoices</div><div class="metric-value" th:text="${#lists.size(openInvoices)}">2</div><a class="small" href="/portal/invoices">View all</a></div></div></div>
<div class="card mb-4"><div class="card-header d-flex justify-content-between"><h2 class="h6 mb-0">My subscriptions</h2><a href="/portal/subscriptions">See all</a></div><div class="list-group list-group-flush"><a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center gap-2" th:each="subscription : ${subscriptions}" th:href="@{|/portal/subscriptions/${subscription.id}|}"><span><strong class="d-block" th:text="${subscription.plan.name}"></strong><small class="text-secondary" th:text="${subscription.number}"></small></span><span th:replace="~{fragments/ui :: statusBadge(${subscription.status})}"></span></a></div></div>
<div class="card"><div class="card-header"><h2 class="h6 mb-0">Invoices to review</h2></div><div class="list-group list-group-flush"><a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center gap-2" th:each="invoice : ${openInvoices}" th:href="@{|/portal/invoices/${invoice.id}|}"><span><strong class="d-block" th:text="${invoice.number}"></strong><small class="text-secondary" th:text="|Due ${@fmt.date(invoice.dueDate)}|"></small></span><span class="text-end"><strong class="d-block" th:text="${@fmt.money(invoice.outstanding)}"></strong><span th:replace="~{fragments/ui :: statusBadge(${invoice.status})}"></span></span></a></div></div>
</div></main></body></html>
