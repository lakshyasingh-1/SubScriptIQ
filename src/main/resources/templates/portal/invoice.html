<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Invoice · SubscriptIQ</title></head><body><main><div class="portal-shell">
<div class="page-heading"><a class="small" href="/portal/invoices">← My invoices</a><div class="d-flex justify-content-between align-items-start mt-3"><div><p class="eyebrow mb-1">INVOICE</p><h1 class="h3 mb-0" th:text="${invoice.number}"></h1></div><span th:replace="~{fragments/ui :: statusBadge(${invoice.status})}"></span></div></div>
<div class="card mb-4"><div class="card-body"><div class="d-flex justify-content-between"><span class="text-secondary">Invoice total</span><strong th:text="${@fmt.money(invoice.total)}"></strong></div><div class="d-flex justify-content-between mt-2"><span class="text-secondary">Paid</span><span th:text="${@fmt.money(invoice.amountPaid)}"></span></div><div class="d-flex justify-content-between mt-2 fw-bold"><span>Outstanding</span><span th:text="${@fmt.money(invoice.outstanding)}"></span></div><hr><div class="d-flex justify-content-between small"><span>Invoice date</span><span th:text="${@fmt.date(invoice.invoiceDate)}"></span></div><div class="d-flex justify-content-between small mt-2"><span>Due date</span><span th:text="${@fmt.date(invoice.dueDate)}"></span></div></div></div>
<div class="card mb-4"><div class="card-header"><h2 class="h6 mb-0">Items</h2></div><div class="list-group list-group-flush"><div class="list-group-item" th:each="line : ${invoice.lines}"><div class="d-flex justify-content-between gap-2"><span class="fw-semibold" th:text="${line.description}"></span><span th:text="${@fmt.money(line.lineAmount)}"></span></div><small class="text-secondary" th:text="|${line.quantity} × ${@fmt.money(line.unitPrice)} · Tax ${line.taxRatePercent}%|"></small></div></div></div>
<div class="card mb-4"><div class="card-header"><h2 class="h6 mb-0">Payments</h2></div><div class="list-group list-group-flush"><div class="list-group-item d-flex justify-content-between" th:each="payment : ${payments}"><span><strong class="d-block" th:text="${payment.method}"></strong><small class="text-secondary" th:text="${@fmt.date(payment.paidOn)}"></small></span><strong th:text="${@fmt.money(payment.amount)}"></strong></div></div></div>
<a class="btn btn-primary w-100" th:href="@{|/portal/invoices/${invoice.id}/pdf|}">Download invoice PDF</a>
</div></main></body></html>
