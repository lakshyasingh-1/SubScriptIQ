<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Payments · SubscriptIQ</title></head><body><main>
<div th:replace="~{fragments/ui :: pageHeader('Payments', 'Record payment', '/payments/new')}"></div>
<div class="card"><div class="card-header"><form class="row g-2 search-toolbar" method="get" action="/payments"><div class="col-sm-8 search-query"><input class="form-control" type="search" name="q" th:value="${q}" placeholder="Search payment, invoice, customer or method" aria-label="Search payments"></div><div class="col-sm-2 search-action"><button class="btn btn-primary" type="submit">Search</button></div><div class="col-sm-2 search-action"><a class="btn btn-outline-secondary" href="/payments">Clear</a></div></form></div><div class="table-responsive" th:if="${page != null and !page.empty}"><table class="table"><thead><tr><th>Payment</th><th>Invoice</th><th>Customer</th><th>Date</th><th>Method</th><th>Amount</th><th>Note</th></tr></thead><tbody>
    <tr th:each="payment : ${page.content}"><td class="text-secondary" th:text="|#${payment.id}|">#1</td><td><a th:href="@{|/invoices/${payment.invoice.id}|}" th:text="${payment.invoice.number}"></a></td><td th:text="${payment.invoice.customer.name}"></td><td th:text="${@fmt.date(payment.paidOn)}"></td><td th:text="${payment.method.toString()}"></td><td class="fw-semibold" th:text="${@fmt.money(payment.amount)}"></td><td th:text="${payment.note}"></td></tr>
</tbody></table></div><th:block th:if="${page == null or page.empty}"><div th:replace="~{fragments/ui :: emptyState(${q == null or q.isBlank() ? 'Payments will show here after they are recorded.' : 'No payments found. Try a different search.'})}"></div></th:block><div class="card-body border-top"><div th:replace="~{fragments/ui :: pagination(${page}, '/payments', ${q}, null, null)}"></div></div></div>
</main></body></html>
